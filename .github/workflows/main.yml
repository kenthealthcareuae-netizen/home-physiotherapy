name: Deploy Home Physiotherapy

on:
  workflow_dispatch:

concurrency:
  group: home-physiotherapy-production
  cancel-in-progress: false

env:
  SITE_PATH: /home/home-physiotherapy.kenthealthcare.ae
  PUBLIC_HTML: /home/home-physiotherapy.kenthealthcare.ae/public_html
  DEPLOY_PORT: 5522

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Validate build
        run: |
          set -e

          echo "Checking build output..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created"
            exit 1
          fi

          echo "Build output:"
          find dist -maxdepth 2 -type f | sort | head -100

          echo "Build validation successful"

      - name: Create deployment package
        run: |
          set -e

          tar -czf home-physiotherapy-dist.tar.gz -C dist .

          echo "Deployment package created:"
          ls -lh home-physiotherapy-dist.tar.gz

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-physiotherapy-dist
          path: home-physiotherapy-dist.tar.gz

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: home-physiotherapy-dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

          ssh-keyscan -p 5522 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          echo "SSH configuration completed"

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -p 5522 \
            -i ~/.ssh/github_actions \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo SSH connection successful"

      - name: Upload deployment package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          scp \
            -P 5522 \
            -i ~/.ssh/github_actions \
            home-physiotherapy-dist.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/home-physiotherapy-dist.tar.gz"

          echo "Deployment package uploaded successfully"

      - name: Create deployment script
        run: |
          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash

          set -e

          SITE="/home/home-physiotherapy.kenthealthcare.ae"
          PUBLIC_HTML="$SITE/public_html"
          BACKUP_ROOT="$SITE/backups"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP="$BACKUP_ROOT/$TIMESTAMP"
          DEPLOY_DIR="/tmp/home-physiotherapy-deploy"

          echo "=========================================="
          echo "Home Physiotherapy Deployment"
          echo "=========================================="

          echo "Checking production directory..."

          if [ ! -d "$PUBLIC_HTML" ]; then
            echo "ERROR: Production directory does not exist:"
            echo "$PUBLIC_HTML"
            exit 1
          fi

          echo "Production directory:"
          echo "$PUBLIC_HTML"

          echo "=========================================="
          echo "Creating backup"
          echo "=========================================="

          mkdir -p "$BACKUP"

          rsync -a \
            "$PUBLIC_HTML/" \
            "$BACKUP/"

          echo "Backup created:"
          echo "$BACKUP"

          echo "=========================================="
          echo "Preparing deployment"
          echo "=========================================="

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          tar -xzf \
            /tmp/home-physiotherapy-dist.tar.gz \
            -C "$DEPLOY_DIR"

          echo "=========================================="
          echo "Validating deployment files"
          echo "=========================================="

          if [ ! -f "$DEPLOY_DIR/index.html" ]; then
            echo "ERROR: index.html missing from deployment"
            exit 1
          fi

          echo "Deployment files validated successfully"

          echo "=========================================="
          echo "Deploying website"
          echo "=========================================="

          rsync -a --delete \
            --exclude=".well-known/" \
            --exclude="php-proxy.php" \
            "$DEPLOY_DIR/" \
            "$PUBLIC_HTML/"

          echo "Website files deployed successfully"

          echo "=========================================="
          echo "Fixing ownership"
          echo "=========================================="

          chown -R homep9657:homep9657 "$PUBLIC_HTML"

          echo "Ownership updated"

          echo "=========================================="
          echo "Cleaning temporary files"
          echo "=========================================="

          rm -rf "$DEPLOY_DIR"
          rm -f /tmp/home-physiotherapy-dist.tar.gz

          echo "Temporary files removed"

          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="
          SCRIPT

          chmod +x deploy.sh

      - name: Upload deployment script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          scp \
            -P 5522 \
            -i ~/.ssh/github_actions \
            deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/home-physiotherapy-deploy.sh"

          echo "Deployment script uploaded"

      - name: Execute deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -p 5522 \
            -i ~/.ssh/github_actions \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/home-physiotherapy-deploy.sh"

          echo "Remote deployment completed"

      - name: Verify website
        run: |
          set -e

          echo "Checking website..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            https://home-physiotherapy.kenthealthcare.ae/ \
            -o /dev/null

          echo "Website verification successful"
